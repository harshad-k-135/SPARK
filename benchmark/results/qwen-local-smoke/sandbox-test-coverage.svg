<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title">
  <title id="title">Sandbox test coverage by execution path</title>
  <rect width="980" height="400" fill="#f7fafc"/>
  <g font-family="Segoe UI, sans-serif" fill="#142335">
    <text x="36" y="48" font-size="30" font-weight="700">Sandbox test coverage</text>
    <text x="36" y="83" font-size="17">Results from the RTX 3050 Laptop GPU Windows host</text>
    <g fill="#e9eff5"><rect x="36" y="107" width="908" height="40"/><rect x="36" y="187" width="908" height="40"/><rect x="36" y="267" width="908" height="40"/></g>
    <g font-size="18">
      <text x="50" y="134">CUDA 12.8 allocation probe</text><text x="405" y="134">Passed</text><text x="565" y="134">RTX 3050 allocated and freed 4 KiB</text>
      <text x="50" y="174">Native SPARK synthetic generation</text><text x="405" y="174">Passed</text><text x="565" y="174">CPU, 24/24 matching greedy tokens</text>
      <text x="50" y="214">External Qwen GGUF chat</text><text x="405" y="214">Passed</text><text x="565" y="214">llama.cpp on CPU, expected reply 4</text>
      <text x="50" y="254">External frontend HTTP</text><text x="405" y="254">Passed</text><text x="565" y="254">HTML, JavaScript and CSS served</text>
      <text x="50" y="294">Live frontend captures</text><text x="405" y="294">Blocked</text><text x="565" y="294">Browser framebuffer and window errors</text>
      <text x="50" y="334">Native SPARK Qwen GPU inference</text><text x="405" y="334">Unavailable</text><text x="565" y="334">Requires Qwen, GGUF and CUDA backend</text>
    </g>
    <text x="36" y="377" font-size="15">Performance comparison requires the same model and workload on both runtimes.</text>
  </g>
</svg>
